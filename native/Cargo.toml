[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
openchamber-native-core = { path = "crates/core" }
gpui-kit = "=0.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
