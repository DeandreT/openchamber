[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop", "crates/transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
openchamber-native-core = { path = "crates/core" }
openchamber-native-transport = { path = "crates/transport" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
# The emulator, key encoder and paste encoder the web terminal runs as
# WebAssembly, built from the same Ghostty revision (vendor/libghostty-vt-sys).
libghostty-vt = { version = "=0.2.0", default-features = false }
keyring = "=4.2.0"
keyring-core = "=1.0.1"
notify = "=8.2.0"
heic-rs = { version = "=0.1.4", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quick-xml = "=0.41.0"
# Message math (KaTeX syntax) and Mermaid diagrams are laid out in Rust and
# drawn as SVG images; the math fonts are KaTeX's, embedded.
ratex-layout = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["embed-fonts"] }
ratex-types = "=0.1.15"
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }
# Fenced code is highlighted with tree-sitter; the grammars cover the
# languages agents most often write.
gpui-kit = { version = "=0.7.3", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "charset"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "=0.1.44"
# Desktop notifications go to `org.freedesktop.Notifications` on the session
# bus; the version is the one GPUI and the keyring already link.
zbus = "=5.19.0"
# Microphone capture for dictation (ALSA on Linux, which PipeWire serves).
cpal = "=0.18.2"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
zed-xim = { path = "vendor/zed-xim" }
xim-ctext = { path = "vendor/xim-ctext" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }
