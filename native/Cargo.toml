[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop", "crates/transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[workspace.dependencies]
openchamber-native-core = { path = "crates/core" }
openchamber-native-transport = { path = "crates/transport" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
# Fenced code is highlighted with tree-sitter; the grammars cover the
# languages agents most often write.
gpui-kit = { version = "=0.7.3", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "charset"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "allow"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
zed-xim = { path = "vendor/zed-xim" }
xim-ctext = { path = "vendor/xim-ctext" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
