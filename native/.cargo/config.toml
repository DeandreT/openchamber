# Linux links through clang with mold. Windows and macOS keep their default
# linkers. A RUSTFLAGS environment variable replaces these rustflags.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
